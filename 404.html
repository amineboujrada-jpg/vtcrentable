<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1116">
<title>Page introuvable | VTC Rentable</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
:root { --night: #0f1116; --night-2: #191c24; --line: #2c3140; --fg: #f1f2f5; --muted: #a2a9b7; --amber: #f2a614; --amber-fg: #1d1400; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--night); color: var(--fg); font: 16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
main { max-width: 34em; display: grid; gap: 18px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; color: var(--fg); text-decoration: none; }
.logo img { width: 30px; height: 30px; border-radius: 8px; }
.logo span, .code { color: var(--amber); }
.code { font: 600 13px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; }
p { margin: 0; color: var(--muted); }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; font-weight: 700; font-size: 15px; padding: 14px 20px; border-radius: 12px; text-decoration: none; border: 1px solid var(--line); color: var(--fg); }
.btn-amber { background: var(--amber); color: var(--amber-fg); border-color: transparent; }
a:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <a class="logo" href="/"><img src="/icon-192.png" alt="" width="30" height="30">VTC <span>Rentable</span></a>
  <p class="code">Erreur 404</p>
  <h1>Cette page n'existe pas.</h1>
  <p>Le lien est peut-être ancien ou mal recopié. Tu peux revenir à l'accueil ou ouvrir directement l'appli.</p>
  <div class="ctas">
    <a class="btn btn-amber" href="/">Revenir à l'accueil</a>
    <a class="btn" href="https://app.vtcrentable.com/">Ouvrir l'appli VTC Rentable</a>
  </div>
</main>
</body>
</html>
